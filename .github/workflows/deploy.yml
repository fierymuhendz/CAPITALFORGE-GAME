name: Deploy

# main dalına her birleştirmede (ve elle) UpCloud sunucusuna yayınlar.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: İmaj adlarını belirle
        id: img
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "server=$REGISTRY/$repo/server:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "web=$REGISTRY/$repo/web:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sunucu imajı
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: ${{ steps.img.outputs.server }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Web imajı
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.img.outputs.web }}
          build-args: NEXT_PUBLIC_GAME_SERVER_URL=${{ vars.PUBLIC_GAME_SERVER_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: SSH anahtarını hazırla
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Sunucuya yayınla
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes $USER@$HOST"
          $SSH 'mkdir -p /opt/capitalforge && chmod 700 /opt/capitalforge'
          scp -i ~/.ssh/id_deploy deploy/docker-compose.prod.yml "$USER@$HOST:/opt/capitalforge/docker-compose.yml"
          {
            echo "SERVER_IMAGE=${{ steps.img.outputs.server }}"
            echo "WEB_IMAGE=${{ steps.img.outputs.web }}"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "JWT_SECRET=$JWT_SECRET"
          } | $SSH 'umask 077 && cat > /opt/capitalforge/.env'
          echo "$GHCR_TOKEN" | $SSH "docker login $REGISTRY -u ${{ github.actor }} --password-stdin"
          # Önce imajları çek, sonra yığını temiz bir ağla yeniden kur. "down" volume'ları silmez
          # (veriler korunur); eski ağda kalan konteynerlerin DNS sorununu (EAI_AGAIN) önler.
          $SSH 'cd /opt/capitalforge && docker compose pull && docker compose down --remove-orphans'
          # Migration veya başlatma başarısız olursa nedenini CI günlüğünde göster.
          if ! $SSH 'cd /opt/capitalforge && docker compose up -d --remove-orphans'; then
            $SSH 'cd /opt/capitalforge && docker compose ps -a; docker network inspect capitalforge_default --format "{{json .IPAM.Config}} {{range .Containers}}{{.Name}}={{.IPv4Address}} {{end}}"; docker compose logs --no-color --tail=200 migrate server' || true
            exit 1
          fi
          $SSH 'docker image prune -f'
          $SSH "docker logout $REGISTRY"

      - name: Sağlık kontrolü
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://$HOST:2567/health"; then exit 0; fi
            sleep 5
          done
          echo "Sunucu /health yanıt vermedi" && exit 1
