# Üretim: sunucuda /opt/capitalforge altında çalışır.
# Değerler aynı klasördeki .env dosyasından gelir (GitHub Actions yazar, elle düzenlemeyin).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: capitalforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: capitalforge
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capitalforge"]
      interval: 5s
      retries: 20
    # Dışarıya port açılmaz: sadece iç ağdan erişilir.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD gerekli}
    # Parola komut satırında (ps) görünmesin diye geçici yapılandırma dosyasına yazılır.
    command:
      - sh
      - -c
      - 'umask 077 && printf "requirepass %s\n" "$$REDIS_PASSWORD" > /tmp/redis.conf && exec redis-server /tmp/redis.conf --appendonly yes'
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: ${SERVER_IMAGE:?SERVER_IMAGE gerekli}
    logging: *logging
    environment:
      DATABASE_URL: postgres://capitalforge:${POSTGRES_PASSWORD}@postgres:5432/capitalforge
    command: ["node_modules/.bin/tsx", "src/db/migrate.ts"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  server:
    image: ${SERVER_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "2567"
      DATABASE_URL: postgres://capitalforge:${POSTGRES_PASSWORD}@postgres:5432/capitalforge
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD gerekli}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET gerekli}
      # Yalnızca Caddy'nin X-Forwarded-For başlığına güvenilir (Caddy gerçek istemci IP'sini yazar)
      TRUST_PROXY: "172.30.0.11"
      NEW_ACCOUNT_TRADE_DELAY_SECONDS: ${NEW_ACCOUNT_TRADE_DELAY_SECONDS:-600}
    # Dışarıya port açılmaz: yalnızca Caddy üzerinden (/api, /ws) erişilir.
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2567/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Günlük 03:00 (Türkiye saati) pg_dump; yedekler ./backups altında (bind mount, compose down'dan etkilenmez).
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    # Dosyaları yayını yapan kullanıcı (deploy) sahiplensin: UID/GID yayın betiği .env'e yazar.
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    entrypoint: ["sh", "/backup.sh"]
    environment:
      # Türkiye yıl boyu UTC+3 (yaz saati yok). Alpine'de tzdata olmadığından POSIX biçimi kullanılır;
      # Europe/Istanbul ile aynı sonucu verir.
      TZ: "<+03>-3"
      PGHOST: postgres
      PGUSER: capitalforge
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      PGDATABASE: capitalforge
      BACKUP_DIR: /backups
      BACKUP_HOUR: "3"
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./restore.sh:/restore.sh:ro
      - ./backups:/backups
    depends_on:
      postgres: { condition: service_healthy }

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE gerekli}
    restart: unless-stopped
    logging: *logging
    # Dışarıya port açılmaz: yalnızca Caddy üzerinden erişilir.
    depends_on:
      server: { condition: service_healthy }

  caddy:
    # Sürüm tam sabitlenir; yükseltme bilinçli bir değişiklik olmalıdır.
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN gerekli}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server: { condition: service_healthy }
      web: { condition: service_started }
    networks:
      default:
        ipv4_address: 172.30.0.11

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # Dinamik adresler .128-.255 arasından verilir, Caddy'nin sabit .11 adresiyle çakışmaz.
          ip_range: 172.30.0.128/25

volumes:
  pgdata:
  redisdata:
  # Sertifikalar: "compose down" çalışsa da silinmez, her yayında yeniden istenmez.
  caddy_data:
  caddy_config:
